name: Update DSA stats

# Recomputes stats/stats.json and the README stats table from this repo's
# own solution directories (no external API calls — see the script for
# how each number is calculated) and commits only if something actually
# changed.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *" # daily safety net in case a push-triggered run was missed
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dsa-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate stats
        run: node .github/scripts/generate-dsa-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/stats.json README.md
          if git diff --cached --quiet; then
            echo "No stats change — nothing to commit."
          else
            git commit -m "chore: update DSA stats [skip ci]"
            git push
          fi
